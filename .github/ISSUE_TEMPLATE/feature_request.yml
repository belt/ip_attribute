name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe
        the use case so we can evaluate the request.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: |
        What are you trying to do? What problem does this solve?
        Is this related to a frustration with the current behavior?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        How would you like this to work? Include example
        Ruby code, schema, or API usage if applicable.
      render: ruby
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Have you considered other approaches or workarounds?
        What are their drawbacks?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the gem does this affect?
      options:
        - ActiveRecord integration
        - ActiveModel::Type
        - Storage strategy detection (dual / single column)
        - Subnet queries (where_ip)
        - IPv4 / IPv6 conversion
        - Generators (migration / column)
        - Refinements
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Compatibility Impact
      description: Best guess — maintainers will confirm.
      options:
        - Backward compatible (minor or patch)
        - Breaking change (major version bump)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Links to RFCs, references, related gems, or anything
        else that helps explain the request.

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues for similar requests
          required: true
        - label: This feature aligns with the project's scope
          required: true
