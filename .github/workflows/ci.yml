# CI — lint, test matrix, audit.
#
# Actions pinned to full SHA for supply-chain safety.
# Node 24 actions (v5+) — Node 20 deprecated June 2026.
# Concurrency: cancel stale runs on same branch/PR.
#
# Matrix: Ruby 3.4 + 4.0 × ActiveRecord 8.1
# AR_VERSION env var pins activerecord/activesupport in Gemfile.
---
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "spec/**"
      - "Gemfile"
      - "ip_attribute.gemspec"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "spec/**"
      - "Gemfile"
      - "ip_attribute.gemspec"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec standardrb --no-fix
      - run: bundle exec reek lib/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        ar: ["8.1"]
    env:
      AR_VERSION: ${{ matrix.ar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec bundler-audit check --update
